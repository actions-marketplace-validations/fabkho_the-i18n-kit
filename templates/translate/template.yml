# the-i18n-kit — translate missing keys (GitLab CI/CD component)
#
# Usage:
#   include:
#     - component: gitlab.com/fabkho/the-i18n-kit/translate@1.0.0
#       inputs:
#         provider: google
#         model: gemini-2.0-flash
#         api_key: $GEMINI_API_KEY
#         layer: common
#
#   i18n-translate:
#     extends: .i18n-translate
#     rules:
#       - if: $CI_PIPELINE_SOURCE == "merge_request_event"
#         changes:
#           - i18n/locales/en.json

spec:
  inputs:
    provider:
      description: 'LLM provider: openai, anthropic, or google'
    model:
      description: 'Model name (e.g. gpt-4o, gemini-2.0-flash)'
    api_key:
      description: 'API key for the chosen provider'
    layer:
      description: 'Layer name (e.g. common, dashboard)'
    locales:
      default: ''
      description: 'Comma-separated target locales (default: all except source)'
    source_locale:
      default: ''
      description: 'Reference locale (default: from .i18n-mcp.json)'
    keys:
      default: ''
      description: 'Comma-separated keys to translate (default: all missing)'
    batch_size:
      default: '50'
      description: 'Keys per LLM call'
    dry_run:
      default: 'false'
      description: 'Preview without writing files'
    install_peer_deps:
      default: ''
      description: 'Space-separated npm packages (e.g. "@google/genai")'
    commit_message:
      default: ''
      description: 'Custom commit message'
    mr_comment:
      default: 'true'
      description: 'Post a summary comment on the MR'

---
.i18n-translate:
  image: node:22-alpine
  stage: lint
  allow_failure: true

  before_script:
    - npm install -g the-i18n-cli@latest
    - |
      if [ -n "$[[ inputs.install_peer_deps ]]" ]; then
        echo "Installing peer dependencies: $[[ inputs.install_peer_deps ]]"
        npm install $[[ inputs.install_peer_deps ]]
      fi

  script:
    - |
      set -euo pipefail

      case "$[[ inputs.provider ]]" in
        openai)    export OPENAI_API_KEY="$[[ inputs.api_key ]]" ;;
        anthropic) export ANTHROPIC_API_KEY="$[[ inputs.api_key ]]" ;;
        google)    export GEMINI_API_KEY="$[[ inputs.api_key ]]" ;;
        *)
          echo "ERROR: Unknown provider: $[[ inputs.provider ]]"
          echo "Must be one of: openai, anthropic, google"
          exit 1
          ;;
      esac

      MISSING=""
      [ -z "$[[ inputs.provider ]]" ] && MISSING="$MISSING provider"
      [ -z "$[[ inputs.model ]]" ]    && MISSING="$MISSING model"
      [ -z "$[[ inputs.api_key ]]" ]  && MISSING="$MISSING api_key"
      [ -z "$[[ inputs.layer ]]" ]    && MISSING="$MISSING layer"
      if [ -n "$MISSING" ]; then
        echo "ERROR: missing required inputs:$MISSING"
        exit 1
      fi

      args="--provider $[[ inputs.provider ]] --model $[[ inputs.model ]] --layer $[[ inputs.layer ]] --batch-size $[[ inputs.batch_size ]] --json"

      [ -n "$[[ inputs.locales ]]" ]       && args="$args --targets $[[ inputs.locales ]]"
      [ -n "$[[ inputs.source_locale ]]" ] && args="$args --ref $[[ inputs.source_locale ]]"
      [ -n "$[[ inputs.keys ]]" ]          && args="$args --keys $[[ inputs.keys ]]"
      [ "$[[ inputs.dry_run ]]" = "true" ] && args="$args --dry-run"

      mkdir -p .i18n-reports
      the-i18n-cli translate $args | tee .i18n-reports/translate-output.json

  after_script:
    - |
      set -euo pipefail

      if [ "$[[ inputs.dry_run ]]" = "true" ]; then
        echo "Dry run complete. No files written."
        exit 0
      fi

      if git diff --quiet -- i18n/locales/ && git diff --cached --quiet -- i18n/locales/; then
        echo "No translation changes to commit."
        exit 0
      fi

      git config user.name "${GITLAB_USER_NAME:-i18n CI}"
      git config user.email "${GITLAB_USER_EMAIL:-ci@the-i18n-kit.dev}"

      if [ -n "$[[ inputs.commit_message ]]" ]; then
        COMMIT_MSG="$[[ inputs.commit_message ]]"
      else
        COMMIT_MSG="i18n: auto-translate missing keys ($[[ inputs.layer ]]) via $[[ inputs.provider ]] [skip ci]"
      fi

      PUSH_URL="https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"
      git add i18n/locales/
      git commit -m "$COMMIT_MSG"
      git push "$PUSH_URL" "HEAD:${CI_COMMIT_REF_NAME}"

      CHANGED_FILES=$(git diff --name-only "HEAD~1" i18n/locales/ | wc -l | tr -d ' ')

      if [ "$[[ inputs.mr_comment ]]" = "true" ] && [ -n "${CI_MERGE_REQUEST_IID:-}" ]; then
        curl --silent --request POST \
          --header "PRIVATE-TOKEN: ${CI_JOB_TOKEN}" \
          --header "Content-Type: application/json" \
          --data "{
            \"body\": \"## i18n Auto-Translate 🌐\n\nAuto-translated missing keys from source locale to target locales.\n\n| | |\n|---|---|\n| Provider | $[[ inputs.provider ]] |\n| Model | $[[ inputs.model ]] |\n| Layer | $[[ inputs.layer ]] |\n| Files changed | ${CHANGED_FILES} |\n\nTranslations pushed to this branch.\"}" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes"
      fi

      echo "Pushed ${CHANGED_FILES} locale file(s) to ${CI_COMMIT_REF_NAME}"
