# the-i18n-kit — find orphan keys (GitLab CI/CD component)
#
# Usage:
#   include:
#     - component: gitlab.com/fabkho/the-i18n-kit/cleanup@1.0.0
#       inputs:
#         layer: root
#
#   i18n-cleanup:
#     extends: .i18n-cleanup
#     rules:
#       - if: $CI_PIPELINE_SOURCE == "merge_request_event"
#         changes:
#           - components/**/*.vue
#           - i18n/locales/*.json

spec:
  inputs:
    layer:
      description: 'Layer name (e.g. root, common)'
    install_peer_deps:
      default: ''
      description: 'Space-separated npm packages'

---
.i18n-cleanup:
  image: node:22-alpine
  stage: lint
  allow_failure: true

  before_script:
    - apk add --no-cache jq
    - npm install -g the-i18n-cli@latest
    - |
      if [ -n "$[[ inputs.install_peer_deps ]]" ]; then
        npm install $[[ inputs.install_peer_deps ]]
      fi

  script:
    - |
      set -euo pipefail

      mkdir -p .i18n-reports

      npx the-i18n-cli orphans \
        --layer "$[[ inputs.layer ]]" \
        --json \
        > .i18n-reports/orphans.json

      ORPHAN_COUNT=$(jq '.summary.totalOrphans // 0' .i18n-reports/orphans.json)

      if [ "$ORPHAN_COUNT" -eq 0 ]; then
        COMMENT="## i18n Cleanup ✅

      No orphan keys found in layer \`$[[ inputs.layer ]]\`. All translation keys are referenced in source code."
      else
        ORPHAN_LIST=$(jq -r '[.orphanKeys[] | "- \`\(.key)\`"] | join("\n")' .i18n-reports/orphans.json)
        COMMENT="## i18n Cleanup ⚠️

      **${ORPHAN_COUNT} orphan key(s) found** in layer \`$[[ inputs.layer ]]\` — keys in locale files with no source code references.

      <details><summary>Click to expand</summary>

      ${ORPHAN_LIST}

      </details>

      > ⚠️ Do not blindly delete all orphans. Some may be dynamically constructed. Review manually.
      > Full report: [job artifacts](${CI_JOB_URL}/artifacts/browse/.i18n-reports/)"
      fi

      echo ""
      echo "============================================"
      echo "  i18n Cleanup Report — layer: $[[ inputs.layer ]]"
      echo "  Orphan keys found: ${ORPHAN_COUNT}"
      echo "============================================"

      if [ -n "${CI_MERGE_REQUEST_IID:-}" ]; then
        curl --silent --request POST \
          --header "PRIVATE-TOKEN: ${CI_JOB_TOKEN}" \
          --header "Content-Type: application/json" \
          --data "$(echo "$COMMENT" | jq -Rs '{body: .}')" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/merge_requests/${CI_MERGE_REQUEST_IID}/notes"
      fi

  artifacts:
    paths:
      - .i18n-reports/orphans.json
    expire_in: 7 days
    when: always
